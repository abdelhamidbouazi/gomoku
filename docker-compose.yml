services:
  server:
    build: .
    expose:
      - "8000"

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:8000}
    expose:
      - "3000"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      - server
